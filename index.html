<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity 9 · Kaizen Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Figtree:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#080928; --teal:#3FBDA8; --pale:#ECF4FF; --ink2:#565972; --white:#fff;
  --teal-ink:#17705F; --miss:#B4423A; --line:#cfdcef;
  --bg:var(--pale); --surface:#fff; --text:var(--navy); --muted:var(--ink2);
  --head:'Exo 2','Cairo',system-ui,sans-serif; --body:'Figtree','Cairo',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080928; --surface:#11133a; --text:#ECF4FF; --muted:#a7adcc; --line:#262a5a; --teal-ink:#3FBDA8; --miss:#ff8a80;
  }
}
:root[data-theme="dark"]{ --bg:#080928; --surface:#11133a; --text:#ECF4FF; --muted:#a7adcc; --line:#262a5a; --teal-ink:#3FBDA8; --miss:#ff8a80; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.55}
[dir="rtl"] body{line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

/* header band: palette motif */
.band{position:relative;background:var(--navy);color:#fff;overflow:hidden;min-height:150px}
.tri{position:absolute;top:0;width:104px;height:104px;background:var(--teal);clip-path:polygon(0 0,100% 0,0 100%)}
.tri.a{inset-inline-start:0} .tri.b{inset-inline-start:104px}
[dir="rtl"] .tri{clip-path:polygon(0 0,100% 0,100% 100%)}
.band-in{position:relative;max-width:1100px;margin:0 auto;padding:26px 24px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;min-height:150px}
.titlebox{padding-top:56px}
.band h1{margin:0;font-family:var(--head);font-weight:700;font-size:clamp(28px,4.6vw,44px);line-height:1.1;letter-spacing:.2px}
.band p{margin:6px 0 0;color:#c8d3ee;font-size:16px}
.badge{flex:none;width:132px;height:132px;border-radius:50%;background:var(--pale);display:grid;place-items:center;margin-bottom:-6px}
.badge img{width:92px;height:auto;display:block}
.lang{position:absolute;top:14px;inset-inline-end:18px;background:transparent;border:1.5px solid #5b6090;color:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px;z-index:2}
.lang:hover{border-color:var(--teal);color:var(--teal)}

main{max-width:1100px;margin:0 auto;padding:28px 24px 56px}
h2{font-family:var(--head);font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.2;margin:0 0 12px}
.lead{max-width:62ch;margin:0 0 24px;font-size:18px}
.meta{color:var(--muted);font-size:15px;margin:0 0 26px}

/* lanes */
.lanes{display:grid;gap:12px}
.lane{position:relative;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px 18px 16px 18px;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start;width:100%;transition:border-color .15s,background .15s}
button.lane:hover:not(:disabled){border-color:var(--navy)}
:root[data-theme="dark"] button.lane:hover:not(:disabled){border-color:var(--teal)}
.glyph{width:30px;height:30px;margin-top:3px;background:var(--navy)}
.g-E{clip-path:polygon(0 100%,100% 100%,0 0);background:var(--teal)}
.g-I{border-radius:50%;background:var(--navy)}
.g-X{background:linear-gradient(135deg,var(--navy) 50%,var(--teal) 50%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g-I{background:var(--pale)}}
.lane b{display:block;font-family:var(--head);font-size:19px;line-height:1.25}
.lane em{font-style:normal;color:var(--teal-ink);font-weight:600}
.lane span.d{display:block;color:var(--muted);font-size:15.5px;margin-top:2px}
.lane:disabled{cursor:default}
.lane.right{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,var(--surface))}
.lane.wrong{border-color:var(--miss)}
.lane .tag{display:block;margin-top:6px;font-size:14.5px;font-weight:700}
.lane.right .tag{color:var(--teal-ink)} .lane.wrong .tag{color:var(--miss)}

.btn{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:13px 30px;font-weight:600;font-size:17px;font-family:var(--head)}
.btn:hover{background:#1b1d55}
.btn.teal{background:var(--teal);color:var(--navy)}
.btn.teal:hover{background:#56cdb9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--teal);color:var(--navy)}}

/* play */
.progress{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pips{display:flex;gap:6px}
.pip{width:22px;height:8px;border-radius:2px;background:var(--line)}
.pip.now{background:var(--navy);outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pip.now{background:var(--pale)}}
.pip.ok{background:var(--teal)} .pip.no{background:var(--miss)}
.count{font-weight:600;color:var(--muted)}
.play{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:start}
@media (max-width:860px){.play{grid-template-columns:1fr}}
.slip{background:var(--surface);border-radius:6px 18px 18px 6px;border-inline-start:10px solid var(--teal);padding:24px 26px 26px;box-shadow:0 1px 0 var(--line)}
[dir="rtl"] .slip{border-radius:18px 6px 6px 18px}
.src{color:var(--muted);font-size:15px;margin:0 0 10px;font-weight:600}
.slip .txt{font-family:var(--head);font-weight:500;font-size:clamp(20px,2.5vw,25px);line-height:1.4;margin:0}
[dir="rtl"] .slip .txt{font-family:'Cairo',sans-serif;font-weight:600;line-height:1.7}
.prompt{margin:0 0 12px;font-weight:600;color:var(--muted)}
.slip.swap{animation:swap .28s ease-out}
@keyframes swap{from{transform:translateX(18px);opacity:.2}to{transform:none;opacity:1}}
[dir="rtl"] .slip.swap{animation-name:swapr}
@keyframes swapr{from{transform:translateX(-18px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.slip.swap{animation:none}}

.fb{margin-top:18px;background:var(--navy);color:#fff;border-radius:14px;padding:20px 22px}
.fb h3{margin:0 0 8px;font-family:var(--head);font-size:19px}
.fb h3 .ok{color:var(--teal)} .fb h3 .no{color:#ffa79f}
.fb p{margin:0 0 12px;color:#e3e9fa}
.fb .q{border-top:1px solid #343867;padding-top:12px;margin-top:4px;color:#fff}
.fb .q i{font-style:normal;color:var(--teal);font-weight:600}
.fb .btn{margin-top:6px}

/* end */
.score{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
.score .n{font-family:var(--head);font-weight:700;font-size:64px;line-height:1}
.score .of{color:var(--muted);font-size:20px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;margin:22px 0 30px;padding:0;list-style:none}
@media (max-width:760px){.res{grid-template-columns:1fr}}
.res li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.res .m{font-weight:700} .res .m.ok{color:var(--teal-ink)} .res .m.no{color:var(--miss)}
.res small{display:block;color:var(--muted);font-size:14px}
.take{background:var(--navy);color:#fff;border-radius:16px;padding:24px 26px;margin-bottom:26px}
.take h3{font-family:var(--head);margin:0 0 8px;font-size:21px}
.take p{margin:0;color:#e3e9fa;max-width:70ch}
.disc ol{margin:0 0 24px;padding-inline-start:22px;max-width:70ch}
.disc li{margin-bottom:10px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--teal);background:transparent}
</style>
</head>

const state = {lang:'en', screen:'intro', i:0, picks:[], swap:false};
const $ = s => document.querySelector(s);
const app = $('#app');
const L = () => DATA[state.lang];

function setLang(){
  const d=L();
  document.documentElement.lang=state.lang; document.documentElement.dir=d.dir;
  $('#lang').textContent=d.toggle; $('#t-title').textContent=d.title; $('#t-sub').textContent=d.sub;
}
function laneGlyph(k){return `<span class="glyph g-${k}" aria-hidden="true"></span>`}
function laneInner(k,tag){const l=L().lanes[k];return `${laneGlyph(k)}<div><b>${l.n}: <em>${l.a}</em></b><span class="d">${l.d}</span>${tag?`<span class="tag">${tag}</span>`:''}</div>`}

function render(){
  setLang();
  const d=L();
  if(state.screen==='intro'){
    app.innerHTML=`
      <h2>${d.introH}</h2>
      <p class="lead">${d.intro}</p>
      <div class="lanes" style="margin-bottom:26px">${LANES.map(k=>`<div class="lane">${laneInner(k)}</div>`).join('')}</div>
      <p class="meta">${d.meta}</p>
      <button class="btn teal" id="start" type="button">${d.start}</button>`;
    $('#start').onclick=()=>{state.screen='play';state.i=0;state.picks=[];state.swap=true;render();};
    return;
  }
  if(state.screen==='play'){
    const s=d.S[state.i], picked=state.picks[state.i], done=picked!==undefined, n=d.S.length;
    const correct=done&&picked===s.lane;
    const pips=d.S.map((x,k)=>{
      let c='pip'; if(state.picks[k]!==undefined)c+=state.picks[k]===DATA.en.S[k].lane?' ok':' no'; else if(k===state.i)c+=' now';
      return `<span class="${c}"></span>`}).join('');
    const lanesHtml=LANES.map(k=>{
      let c='lane',tag='';
      if(done){ if(k===s.lane){c+=' right';tag=d.bestTag} else if(k===picked){c+=' wrong';tag=d.yourTag} }
      return `<button class="${c}" data-k="${k}" type="button" ${done?'disabled':''}>${laneInner(k,tag)}</button>`}).join('');
    app.innerHTML=`
      <div class="progress"><span class="count">${d.of(state.i+1,n)}</span><div class="pips" aria-hidden="true">${pips}</div></div>
      <div class="play">
        <div>
          <article class="slip ${state.swap?'swap':''}">
            <p class="src">${s.src}</p>
            <p class="txt">${s.text}</p>
          </article>
          ${done?`<section class="fb" id="fb" tabindex="-1">
            <h3>${correct?`<span class="ok">${d.right}</span>`:`<span class="no">${d.wrong}</span>`} ${d.best}: ${d.lanes[s.lane].n} · ${s.el}</h3>
            <p>${s.why}</p>
            <p class="q"><i>${d.mq}:</i> ${s.q}</p>
            <button class="btn teal" id="next" type="button">${state.i===n-1?d.finish:d.next}</button>
          </section>`:''}
        </div>
        <div>
          <p class="prompt">${d.prompt}</p>
          <div class="lanes">${lanesHtml}</div>
        </div>
      </div>`;
    state.swap=false;
    app.querySelectorAll('button.lane').forEach(b=>b.onclick=()=>{state.picks[state.i]=b.dataset.k;render();const fb=$('#fb');if(fb){fb.scrollIntoView({block:'nearest',behavior:'smooth'});$('#next').focus({preventScroll:true});}});
    const nx=$('#next'); if(nx) nx.onclick=()=>{ if(state.i===n-1){state.screen='end'}else{state.i++;state.swap=true} render(); window.scrollTo({top:0,behavior:'smooth'}); };
    return;
  }
  if(state.screen==='end'){
    const n=d.S.length, ok=d.S.filter((s,k)=>state.picks[k]===s.lane).length;
    app.innerHTML=`
      <h2>${d.endH}</h2>
      <div class="score"><span class="n">${ok}</span><span class="of">/ ${n} ${d.outOf}</span></div>
      <ul class="res" aria-label="${d.review}">${d.S.map((s,k)=>{const g=state.picks[k]===s.lane;return `<li><span class="m ${g?'ok':'no'}" aria-hidden="true">${g?'✓':'×'}</span><span>${s.t}<small>${d.lanes[s.lane].n}${g?'':` · ${d.yours}: ${d.lanes[state.picks[k]].n}`}</small></span></li>`}).join('')}</ul>
      <section class="take"><h3>${d.takeH}</h3><p>${d.take}</p></section>
      <section class="disc"><h2 style="font-size:22px">${d.discH}</h2><ol>${d.disc.map(x=>`<li>${x}</li>`).join('')}</ol></section>
      <div class="actions"><button class="btn ghost" id="again" type="button">${d.again}</button></div>`;
    $('#again').onclick=()=>{state.screen='intro';state.picks=[];state.i=0;render();window.scrollTo({top:0});};
  }
}
$('#lang').onclick=()=>{state.lang=state.lang==='en'?'ar':'en';render();};
render();
</script>
